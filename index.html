:root{color-scheme:dark;--bg:#10171b;--panel:#1b272d;--line:#34454b;--gold:#e8c48a;--muted:#a9b9bc;--green:#77b99a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef2ef;font:16px system-ui}header{padding:18px 22px;background:#172126;display:flex;justify-content:space-between;align-items:center;gap:12px}h1,h2,h3,p{margin:0 0 12px}h1{font: bold 25px Georgia;color:var(--gold)}small,.muted{color:var(--muted)}nav{position:sticky;top:0;z-index:5;background:#172126;display:flex;overflow:auto;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}button,input,select,textarea{font:inherit;color:inherit;background:#26363d;border:1px solid var(--line);border-radius:9px;padding:10px}button{min-height:46px;cursor:pointer;white-space:nowrap}button.active,.primary{background:#e8c48a;color:#172126;font-weight:bold}button.danger{color:#ffaaa2}button:disabled{opacity:.4}main{max-width:1300px;margin:auto;padding:16px 16px 120px}article{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:12px}h2{font-size:23px}h3{font-size:17px;color:var(--gold)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.split{display:grid;grid-template-columns: minmax(0,1.4fr) minmax(0,1fr);gap:12px}.current{border:2px solid var(--gold)}.dead{opacity:.5}.hp{height:8px;background:#38484d;border-radius:8px;overflow:hidden;margin:8px 0}.hp i{display:block;height:100%;background:var(--green)}input[type=number]{width:85px}input[type=text],textarea{width:100%}textarea{min-height:90px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:6px 0}label input,label textarea,label select{display:block;margin-top:4px}details{border-top:1px solid var(--line);padding:9px 0}summary{cursor:pointer;padding:7px 0}blockquote{margin:8px 0 16px;padding:12px 16px;border-left:3px solid var(--gold);background:#202e34;font:19px/1.5 Georgia}a{color:var(--gold)}.tag{font-size:12px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}.audio{position:fixed;bottom:0;left:0;right:0;background:#172126;border-top:1px solid var(--line);padding:8px 12px max(8px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px;align-items:center;overflow:auto}.audio button{min-height:44px}.pill{border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:13px}.notice{border-left:3px solid var(--gold);padding:10px;color:var(--muted)}@media(max-width:750px){.split{grid-template-columns:1fr}header{padding:12px}h1{font-size:20px}} </style></head><body><header><div><div class="tag">Private campaign workspace · v0.4</div><h1>The Lost Covenant</h1><small>2024 revised 5e · Session 01</small></div><button onclick="backup()">Backup ↓</button></header><nav id="nav"></nav><main id="main"></main><div class="audio" id="audio"></div><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), clone=x=>JSON.parse(JSON.stringify(x));
const initial={"party": [], "scenes": [{"title": "Welcome \u2014 import your campaign", "cue": "Silence", "time": "", "read": "Open Setup and import your private campaign JSON.", "dm": "", "checks": "", "secret": "", "next": ""}], "scene": 0, "round": 1, "turn": 0, "started": false, "fighters": [], "log": [], "notes": [], "clues": [], "ideas": "", "npcs": "", "session": "01", "mode": "Live"};
let S=clone(initial), tab='Session', history=[], storage=true;try{let x=null;if(x)S=JSON.parse(x)}catch(e){storage=false}function save(){try{localStorage.setItem('lost-covenant-v02',JSON.stringify(S))}catch(e){storage=false}}function change(fn){history.push(clone(S));if(history.length>50)history.shift();fn();save();render()}function log(t){S.log.push({time:new Date().toISOString(),round:S.round,text:t})}function undo(){if(history.length){S=history.pop();save();render()}}function setTab(t){tab=t;render()}function field(obj,key,v){obj[key]=v;save()}function fighter(id){return S.fighters.find(x=>x.id===id)}function patch(id,k,v){change(()=>fighter(id)[k]=v)}function loadEncounter(){if(S.started&&!confirm('Replace active encounter?'))return;change(()=>{S.fighters=S.party.map(p=>({...clone(p),pc:true,hp:p.max,init:null,conditions:'',inspiration:false,temp:0,success:0,fail:0}));for(let i=1;i<=2;i++)S.fighters.push({id:uid(),name:'Bridge skitter '+i,role:'Draft homebrew enemy',pc:false,max:7,hp:7,ac:12,mod:1,init:null,temp:0,conditions:'',info:'Draft: Speed 30 ft; Claw +3 to hit, reach 5 ft, 1d4+1 slashing. Retreat when badly wounded if appropriate. Not a verified official stat block.'});S.started=false;S.round=1;S.turn=0;log('Loaded draft bridge encounter')})}function addEnemy(){change(()=>S.fighters.push({id:uid(),name:'New enemy',role:'Custom',pc:false,max:5,hp:5,ac:10,mod:0,init:null,temp:0,conditions:'',info:''}))}function start(){if(!S.fighters.length||S.fighters.some(f=>f.init===null||!Number.isFinite(f.init)))return alert('Enter initiative for every combatant.');change(()=>{S.fighters.sort((a,b)=>b.init-a.init);S.started=true;S.round=1;S.turn=0;log('Combat started')})}function advance(){if(!S.started)return;change(()=>{let n=S.fighters.length;if(!n)return;do{S.turn++;if(S.turn>=n){S.turn=0;S.round++}}while(S.fighters.some(f=>f.pc||f.hp!==0)&&!S.fighters[S.turn].pc&&S.fighters[S.turn].hp===0);log('Turn: '+S.fighters[S.turn].name)})}function damage(id,heal=false){let f=fighter(id),el=$('amt-'+id),n=Number(el.value);if(!el.value||!Number.isFinite(n)||n<0||f.hp===null)return;change(()=>{if(heal){f.hp=Math.min(f.max,f.hp+n);if(f.hp>0){f.success=0;f.fail=0}}else{let absorbed=Math.min(f.temp||0,n);f.temp-=absorbed;f.hp=Math.max(0,f.hp-n+absorbed)}log(f.name+' '+(heal?'healed ':'damage ')+n+' → '+f.hp+' HP')})}function removeF(id){if(!confirm('Remove combatant?'))return;change(()=>{let current=S.fighters[S.turn]?.id;S.fighters=S.fighters.filter(f=>f.id!==id);let i=S.fighters.findIndex(f=>f.id===current);S.turn=i>=0?i:Math.min(S.turn,Math.max(0,S.fighters.length-1));if(!S.fighters.length)S.started=false})}function num(v){return v===''?null:Number(v)}function fcard(f,i){return `<article class="${S.started&&i===S.turn?'current':''} ${!f.pc&&f.hp===0?'dead':''}"><div class="row spread"><div><span class="tag">${f.pc?'Player':'Enemy'} ${S.started&&i===S.turn?' · CURRENT TURN':''}</span><h3>${esc(f.name)}</h3></div><strong>AC ${esc(f.ac??'—')}</strong><label>Initiative<input type="number" value="${esc(f.init)}" onchange="patch('${f.id}','init',num(this.value))"></label></div><div class="row spread"><strong>${f.hp??'Pending'} / ${f.max??'—'} HP</strong><small>Temp ${f.temp||0}</small></div><div class="hp"><i style="width:${f.max?Math.min(100,100*f.hp/f.max):0}%"></i></div><div class="row"><input id="amt-${f.id}" type="number" min="0" placeholder="Amount" inputmode="numeric"><button class="danger" onclick="damage('${f.id}')">Damage</button><button onclick="damage('${f.id}',true)">Heal</button>${f.pc?`<button class="${f.inspiration?'active':''}" onclick="patch('${f.id}','inspiration',!fighter('${f.id}').inspiration)">★ Inspiration</button>`:''}</div><label>Conditions / concentration<input type="text" value="${esc(f.conditions)}" onchange="patch('${f.id}','conditions',this.value)"></label>${f.pc&&f.hp===0?`<div class="row"><button onclick="patch('${f.id}','success',Math.min(3,(fighter('${f.id}').success||0)+1))">Save ✓ ${f.success||0}/3</button><button onclick="patch('${f.id}','fail',Math.min(3,(fighter('${f.id}').fail||0)+1))">Fail ✗ ${f.fail||0}/3</button><small>Resolve natural 1/20 and stabilization manually.</small></div>`:''}<details><summary>Abilities & edit stats</summary><p>${esc(f.info)}</p><label>Name<input type="text" value="${esc(f.name)}" onchange="patch('${f.id}','name',this.value)"></label><div class="row">${['hp','max','ac','temp','mod'].map(k=>`<label>${k}<input type="number" value="${esc(f[k])}" onchange="patch('${f.id}','${k}',num(this.value))"></label>`).join('')}</div><label>Stat block<textarea onchange="patch('${f.id}','info',this.value)">${esc(f.info)}</textarea></label><button class="danger" onclick="removeF('${f.id}')">Remove</button></details></article>`} 
function sessionView(){let s=S.scenes[S.scene];return `<div class="split"><section><article><div class="tag">Scene ${S.scene+1} of ${S.scenes.length} · ${esc(s.time)}</div><h2>${esc(s.title)}</h2><blockquote>${esc(s.read)}</blockquote><button class="primary" onclick="cue('${s.cue}')">♫ ${esc(s.cue)}</button><h3 style="margin-top:16px">Run the scene</h3><p>${esc(s.dm)}</p><details open><summary>Checks & mechanics</summary>${esc(s.checks)}</details><details><summary>DM secrets / clues</summary>${esc(s.secret)}</details><details><summary>Transition</summary>${esc(s.next)}</details><div class="row"><button onclick="goScene(-1)">← Previous</button><button class="primary" onclick="goScene(1)">Next scene →</button>${S.scene===3?'<button onclick="setTab(\'Combat\')">Open combat</button>':''}</div></article><article><h3>Edit scene preparation</h3>${['title','time','read','dm','checks','secret','next'].map(k=>`<label>${k}<textarea onchange="field(S.scenes[S.scene],'${k}',this.value)">${esc(s[k])}</textarea></label>`).join('')}</article></section><aside><article><h3>Session roadmap</h3>${S.scenes.map((x,i)=>`<button style="width:100%;text-align:left;margin:3px 0" class="${i===S.scene?'active':''}" onclick="change(()=>S.scene=${i})">${i+1}. ${esc(x.title)}</button>`).join('')}</article><article><h3>Quick capture</h3>${noteForm()}</article><article><h3>Preparation status</h3><p class="notice">NPC names, final sheets, encounter balance and covenant answers remain provisional. Scene timings are suggestions.</p></article></aside></div>`}function goScene(d){change(()=>{S.scene=Math.max(0,Math.min(S.scenes.length-1,S.scene+d));log('Scene: '+S.scenes[S.scene].title)})}function noteForm(){return `<select id="kind">${['Event','Decision','Clue','NPC','Loot','Ruling','Idea','Feedback'].map(x=>`<option>${x}</option>`).join('')}</select><textarea id="note" placeholder="What happened?" style="margin:8px 0"></textarea><button class="primary" onclick="addNote()">Save note</button>`}function addNote(){let v=$('note').value.trim(),k=$('kind').value;if(v)change(()=>S.notes.push({kind:k,text:v,scene:S.scene+1,time:new Date().toISOString()}))}function combatView(){let f=S.fighters[S.turn];return `<article><div class="row spread"><div><div class="tag">${S.started?'Round '+S.round:'Encounter preparation'}</div><h2>${S.started?esc(f?.name)+'’s turn':'Encounter preparation'}</h2>${S.started?'<small>Next in order: '+esc(S.fighters[(S.turn+1)%S.fighters.length]?.name)+'</small>':''}</div><div class="row"><button onclick="loadEncounter()">Load first encounter</button><button onclick="addEnemy()">+ Enemy</button><button onclick="undo()" ${history.length?'':'disabled'}>Undo</button>${S.started?'<button class="primary" onclick="advance()">Next turn →</button><button onclick="change(()=>{S.started=false;log(\'Combat ended\')})">End</button>':'<button class="primary" onclick="start()">Start combat</button>'}</div></div><p class="muted">Enter total initiative rolls. Ties retain entry order; edit order by adjusting initiative before start if agreed. Draft enemies require review. Players track their own resources.</p></article><div class="grid">${S.fighters.map(fcard).join('')}</div>`}function partyView(){return `<div class="grid">${S.party.map((p,i)=>`<article><div class="tag">${esc(p.role)}</div><h2>${esc(p.name)}</h2><div class="row"><span class="pill">HP ${p.max??'Pending'}</span><span class="pill">AC ${p.ac??'Pending'}</span><span class="pill">Initiative ${p.mod??'Pending'}</span></div><p style="margin-top:12px">${esc(p.info)}</p><details><summary>Private character arc</summary>${esc(p.hook)}</details><details><summary>Edit party record</summary>${['name','role','info','hook'].map(k=>`<label>${k}<textarea onchange="field(S.party[${i}],'${k}',this.value)">${esc(p[k])}</textarea></label>`).join('')}<div class="row">${['max','ac','mod'].map(k=>`<label>${k}<input type="number" value="${esc(p[k])}" onchange="field(S.party[${i}],'${k}',num(this.value))"></label>`).join('')}</div></details></article>`).join('')}</div><p class="notice">Party edits apply when loading a new encounter, not retroactively to active combat.</p>`}function cluesView(){return `<article><h2>Clue ledger</h2><p class="muted">Only mark discovered when players actually encounter a clue.</p>${S.clues.map((c,i)=>`<details><summary>${esc(c.id)} · ${esc(c.title)} — ${esc(c.status)}</summary><label>Status<select onchange="change(()=>S.clues[${i}].status=this.value)">${['Planned','Introduced','Discovered','Understood'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Who noticed / theory<textarea onchange="field(S.clues[${i}],'who',this.value)">${esc(c.who)}</textarea></label></details>`).join('')}</article><article><h3>NPC register (draft)</h3><textarea onchange="field(S,'npcs',this.value)">${esc(S.npcs)}</textarea><h3>Future ideas · not canon</h3><textarea onchange="field(S,'ideas',this.value)">${esc(S.ideas)}</textarea></article>`}function notesView(){return `<article><h2>Session capture</h2>${noteForm()}</article><article><div class="row spread"><h3>Recorded notes (${S.notes.length})</h3><button onclick="exportLog()">Export session report</button></div>${S.notes.map((n,i)=>`<details open><summary>${esc(n.kind)} · Scene ${n.scene}</summary><p>${esc(n.text)}</p><button class="danger" onclick="change(()=>S.notes.splice(${i},1))">Delete</button></details>`).join('')||'<p class="muted">No notes yet.</p>'}</article><article><h3>Combat / scene history</h3>${S.log.slice().reverse().map(x=>`<p><small>R${x.round}</small> ${esc(x.text)}</p>`).join('')}</article>`}function rulesView(){return `<div class="grid">${[['D20 tests','Roll d20 + relevant modifier + proficiency if applicable. Meet or exceed DC/AC. Advantage/disadvantage: roll two, keep higher/lower; cancel each other.'],['Turn','Move up to speed; one action; bonus action only if a feature allows it. One reaction until start of next turn.'],['Attacks','Natural 20 hits and doubles damage dice. Natural 1 misses. Add modifiers once.'],['Heroic Inspiration','Immediately after rolling any die, spend to reroll and use new result. Hold only one; if awarded while holding one, give it to another PC who lacks it. Humans gain it after a Long Rest.'],['Death saves','At start of turn at 0 HP: 10+ success; three successes stabilize, three failures die. Natural 1 = two failures; natural 20 = regain 1 HP. Damage at 0 HP can cause failures.'],['Concentration','When taking damage, Constitution save DC 10 or half damage rounded down, whichever higher (maximum DC 30). Only one concentration spell at a time.']].map(([a,b])=>`<article><h3>${a}</h3><p>${b}</p></article>`).join('')}</div><a href="https://www.dndbeyond.com/sources/dnd/free-rules" target="_blank" rel="noopener">Official free rules ↗</a>`}function settingsView(){return `<article><h2>Data & audio setup</h2><p>${storage?'Browser storage available; backups still recommended.':'Browser storage unavailable. Export before closing.'}</p><button onclick="backup()">Export full JSON backup</button><label>Restore backup (replaces current state)<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label><p>Audio files are selected locally and remain available only while this page stays open. Choose files you have permission to use. No tracks are bundled.</p>${audioNames.map(n=>`<label>${n}<input type="file" accept="audio/*" onchange="assignAudio('${n}',this.files[0])"></label>`).join('')}<a href="https://tabletopaudio.com/" target="_blank" rel="noopener">Tabletop Audio ↗</a></article><article><h3>Session management</h3><button class="danger" onclick="if(confirm('Clear live notes and combat history? Export first.'))change(()=>{S.notes=[];S.log=[];S.fighters=[];S.started=false;S.round=1;S.turn=0;S.scene=0})">Clear live session data</button></article>`}function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}function backup(){download('lost-covenant-backup.json',JSON.stringify({version:2,state:S},null,2),'application/json')}async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.version!==2||!Array.isArray(x.state?.party)||!Array.isArray(x.state?.scenes)||!Array.isArray(x.state?.fighters)||!Array.isArray(x.state?.notes)||!Array.isArray(x.state?.clues)||!Array.isArray(x.state?.log)||!x.state.scenes[x.state.scene])throw Error();if(confirm('Replace current data with backup?'))change(()=>S=x.state)}catch(e){alert('Invalid v0.3 backup')}}function exportLog(){download('session-'+S.session+'-report.txt',['THE LOST COVENANT — DM ONLY','Session '+S.session,...S.notes.map(n=>n.kind+' / Scene '+n.scene+': '+n.text),'CLUES',...S.clues.map(c=>c.id+' '+c.title+' — '+c.status+' '+c.who),'EVENT HISTORY',...S.log.map(l=>'Round '+l.round+': '+l.text),'FINAL COMBAT STATE',...S.fighters.map(f=>f.name+': '+f.hp+'/'+f.max+' HP; '+f.conditions)].join('\n'),'text/plain')}
const audioNames=['Festival','Tavern','Bell','River','Combat','Dungeon','Mystery','Knock'], tracks={},bg=new Audio(),fx=new Audio();bg.loop=true;bg.volume=.25;fx.volume=.55;let playing='Silence';function assignAudio(n,f){if(f){if(tracks[n])URL.revokeObjectURL(tracks[n]);tracks[n]=URL.createObjectURL(f)}}function cue(n){if(n==='Silence'){bg.pause();fx.pause();playing=n;audioBar();return}if(!tracks[n]){alert('No audio assigned for '+n+'. Open Setup to choose a local audio file.');return}let effect=['Bell','Knock'].includes(n),a=effect?fx:bg;a.src=tracks[n];a.play().then(()=>{if(!effect)playing=n;audioBar()}).catch(()=>alert('Playback failed. Try selecting the file again.'))}function audioBar(){$('audio').innerHTML=`<small>♫ ${esc(playing)}</small>${audioNames.map(n=>`<button class="${playing===n?'active':''}" onclick="cue('${n}')">${n}</button>`).join('')}<button onclick="cue('Silence')">■ Silence</button><label>Volume<input type="range" min="0" max="1" step=".05" value="${bg.volume}" oninput="bg.volume=Number(this.value)"></label>`}function render(){$('nav').innerHTML=['Session','Combat','Party','Clues & NPCs','Notes','Rules','Setup'].map(t=>`<button class="${t===tab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');$('main').innerHTML=({Session:sessionView,Combat:combatView,Party:partyView,'Clues & NPCs':cluesView,Notes:notesView,Rules:rulesView,Setup:settingsView}[tab])();audioBar()}
const KEY='lost-covenant-v03-state';
let redoStack=[], checkpoint=null, previous=null, encounterCheckpoint=null, liveCopy=null, practice=false, ruleQuery='';
const defaultEnemy={name:'Bridge skitter',role:'Draft homebrew',max:7,ac:12,mod:1,info:'Speed 30 ft; Claw +3, 1d4+1 slashing. Provisional.'};
function normalize(){S.party.forEach(p=>{for(const [k,v] of Object.entries({hp:p.max,temp:0,conditions:'',inspiration:false,success:0,fail:0,inventory:'',gold:0,resources:'',level:1}))if(!(k in p))p[k]=v});S.library??=[{id:'skitter',...defaultEnemy}];S.encounters??=[{id:'bridge',name:'Disaster at the bridge (draft)',members:{skitter:2}}];S.campaign??={bible:'',quests:'',lore:'',factions:'',secrets:'',theories:'',rulings:''};S.archive??=[];S.audioAssignments??={};S.fighters.forEach(f=>{if(f.pc){let p=S.party.find(p=>p.id===f.id);if(p)Object.assign(p,Object.fromEntries(Object.entries(f).filter(([k])=>['hp','temp','conditions','inspiration','success','fail'].includes(k))))}});}
try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){({state:S,history,redoStack,checkpoint,previous,encounterCheckpoint,liveCopy,practice,tab}=d)}}catch(e){storage=false}
normalize();checkpoint??=clone(S);previous??=clone(S);
function sync(){for(const f of S.fighters.filter(f=>f.pc)){let p=S.party.find(p=>p.id===f.id);if(p)for(const k of ['hp','max','ac','mod','temp','conditions','inspiration','success','fail','name','info'])p[k]=f[k]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state:S,history,redoStack,checkpoint,previous,encounterCheckpoint,liveCopy,practice,tab}));storage=true}catch(e){storage=false}let el=$('saveStatus');if(el)el.textContent=storage?'Saved locally':'SAVE FAILED — export now'}
function change(fn){history.push(clone(S));if(history.length>30)history.shift();redoStack=[];fn();sync();save();render()}
function undo(){if(history.length){redoStack.push(clone(S));S=history.pop();save();render()}}
function redo(){if(redoStack.length){history.push(clone(S));S=redoStack.pop();save();render()}}
function field(obj,key,v){change(()=>{obj[key]=v;if(S.party.includes(obj)){let f=fighter(obj.id);if(f)f[key]=v}})}
function setTab(t){tab=t;save();render()}
function loadEncounter(){loadCustom(S.encounters[0]?.id)}
function loadCustom(id){let e=S.encounters.find(e=>e.id===id);if(!e)return;if(S.started&&!confirm('Replace active encounter?'))return;encounterCheckpoint=clone(S);change(()=>{S.fighters=S.party.map(p=>({...clone(p),pc:true,init:null}));for(const [id,n] of Object.entries(e.members)){let m=S.library.find(x=>x.id===id);if(m)for(let i=0;i<n;i++)S.fighters.push({...clone(m),id:uid(),name:m.name+' '+(i+1),pc:false,hp:m.max,init:null,temp:0,conditions:''})}S.started=false;S.round=1;S.turn=0;log('Loaded '+e.name)})}
function newEncounter(){let name=prompt('Encounter name');if(name)change(()=>S.encounters.push({id:uid(),name,members:{}}))}
function newTemplate(){let name=prompt('Enemy name');if(name)change(()=>S.library.push({id:uid(),name,role:'Custom',max:5,ac:10,mod:0,info:''}))}
function libraryView(){return `<article><div class="row spread"><h2>Encounter library</h2><button onclick="newEncounter()">+ Encounter</button></div>${S.encounters.map((e,i)=>`<details><summary>${esc(e.name)}</summary><label>Name<input value="${esc(e.name)}" onchange="field(S.encounters[${i}],'name',this.value)"></label>${S.library.map(m=>`<div class="row spread"><span>${esc(m.name)}</span><input type="number" min="0" max="30" value="${e.members[m.id]||0}" onchange="change(()=>S.encounters[${i}].members['${m.id}']=Math.max(0,Math.min(30,Math.floor(Number(this.value)||0))))"></div>`).join('')}<button class="primary" onclick="loadCustom('${e.id}');setTab('Combat')">Load encounter</button> <button onclick="change(()=>S.encounters.push({...clone(S.encounters[${i}]),id:uid(),name:S.encounters[${i}].name+' copy'}))">Duplicate</button></details>`).join('')}</article><article><div class="row spread"><h2>Enemy library</h2><button onclick="newTemplate()">+ Template</button></div>${S.library.map((m,i)=>`<details><summary>${esc(m.name)} · HP ${m.max} · AC ${m.ac}</summary>${['name','role','info'].map(k=>`<label>${k}<textarea onchange="field(S.library[${i}],'${k}',this.value)">${esc(m[k])}</textarea></label>`).join('')}${['max','ac','mod'].map(k=>`<label>${k}<input type="number" value="${m[k]}" onchange="field(S.library[${i}],'${k}',Number(this.value))"></label>`).join('')}<button onclick="reinforce(${i})">Add to current combat</button></details>`).join('')}</article>`}
function reinforce(i){change(()=>{let m=S.library[i],f={...clone(m),id:uid(),pc:false,hp:m.max,init:S.started?Math.floor(Math.random()*20)+1+m.mod:null,temp:0,conditions:''};let current=S.fighters[S.turn]?.id;S.fighters.push(f);if(S.started){S.fighters.sort((a,b)=>b.init-a.init);S.turn=S.fighters.findIndex(x=>x.id===current)}})}
const oldPartyView=partyView;
function partyPlus(){return `<article><h2>Persistent party state</h2><p class="muted">Combat and party share HP and conditions. Rest recovery is manual for custom resources.</p></article><div class="grid">${S.party.map((p,i)=>`<article><h2>${esc(p.name)}</h2><p>${esc(p.role)}</p><strong>${p.hp??'Pending'} / ${p.max??'—'} HP · AC ${p.ac??'—'}</strong><div class="hp"><i style="width:${p.max?100*p.hp/p.max:0}%"></i></div><div class="row">${['hp','max','ac','temp','mod','level','gold','success','fail'].map(k=>`<label>${k}<input type="number" value="${esc(p[k])}" onchange="field(S.party[${i}],'${k}',num(this.value))"></label>`).join('')}</div><label><input type="checkbox" ${p.inspiration?'checked':''} onchange="field(S.party[${i}],'inspiration',this.checked)"> Heroic Inspiration</label>${['conditions','resources','inventory','info','hook','name','role'].map(k=>`<details ${['conditions','resources','inventory'].includes(k)?'open':''}><summary>${k}</summary><textarea onchange="field(S.party[${i}],'${k}',this.value)">${esc(p[k])}</textarea></details>`).join('')}</article>`).join('')}</div><article><button onclick="rest(false)">Short rest</button> <button onclick="rest(true)">Long rest</button></article>`}
function rest(long){if(!confirm(long?'Restore HP and clear temporary HP? Review other resources manually.':'Record short rest? Apply healing and resource recovery manually.'))return;change(()=>{if(long)for(const p of S.party){p.hp=p.max;p.temp=0;p.success=p.fail=0;if(p.role.includes('Human'))p.inspiration=true;let f=fighter(p.id);if(f)Object.assign(f,p)}log(long?'Long rest; review conditions and resources':'Short rest; review hit dice and resources')})}
function campaignView(){return `<article><h2>Campaign bible & records</h2>${Object.keys(S.campaign).map(k=>`<details><summary>${esc(k)}</summary><textarea onchange="field(S.campaign,'${k}',this.value)">${esc(S.campaign[k])}</textarea></details>`).join('')}</article>${cluesView()}<article><h3>Session archive</h3>${S.archive.map(a=>`<details><summary>Session ${esc(a.session)} · ${esc(a.date)}</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(a.notes,null,2))}</pre></details>`).join('')}</article>`}
function resetTo(which){let x=which==='previous'?previous:which==='encounter'?encounterCheckpoint:checkpoint;if(!x)return alert('No checkpoint yet');if(confirm('Restore '+which+' checkpoint? Undo remains available.'))change(()=>S=clone(x))}
function togglePractice(){if(!practice){liveCopy={state:clone(S),history:clone(history),redoStack:clone(redoStack),checkpoint:clone(checkpoint),previous:clone(previous),encounterCheckpoint:clone(encounterCheckpoint)};practice=true;history=[];redoStack=[];checkpoint=clone(S)}else{if(!confirm('Discard practice changes?'))return;({state:S,history,redoStack,checkpoint,previous,encounterCheckpoint}=liveCopy);liveCopy=null;practice=false}save();render()}
function finishSession(){if(practice)return alert('Exit practice first');if(S.started)return alert('End combat first');if(!confirm('Archive session and create next session checkpoint?'))return;change(()=>{S.archive.push({session:S.session,date:new Date().toISOString(),notes:clone(S.notes),log:clone(S.log)});S.session=String(Number(S.session)+1).padStart(2,'0');S.notes=[];S.log=[];S.fighters=[];S.scene=0;S.round=1;S.turn=0});previous=clone(S);checkpoint=clone(S);save();backup()}
function backup(){download('lost-covenant-v03-'+(practice?'practice':'live')+'.json',JSON.stringify({version:3,state:S,checkpoint,previous,encounterCheckpoint,history,redoStack,practice,liveCopy},null,2),'application/json')}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(![2,3].includes(d.version)||!Array.isArray(d.state?.party)||!Array.isArray(d.state?.scenes)||!Array.isArray(d.state?.fighters)||!d.state.scenes[d.state.scene])throw Error();if(confirm('Import backup? Current state remains in undo history.')){change(()=>{S=d.state;normalize()});checkpoint=d.checkpoint||clone(S);previous=d.previous||clone(S);encounterCheckpoint=d.encounterCheckpoint||null;practice=!!d.practice;liveCopy=d.liveCopy||null;save();render()}}catch(e){alert('Invalid backup')}}
function setupPlus(){return `<article><h2>Recovery & session controls</h2><button class="primary" onclick="togglePractice()">${practice?'Exit practice':'Enter practice mode'}</button> <button onclick="backup()">Export campaign JSON</button> <button onclick="exportLog()">Export session report</button><label>Import backup (v0.2 or v0.3)<input type="file" accept=".json" onchange="restore(this.files[0])"></label><div class="row"><button onclick="if(confirm('Set current state as session start?')){checkpoint=clone(S);save();render()}">Set start checkpoint</button><button onclick="resetTo('start')">Restart session</button><button onclick="resetTo('previous')">Restore previous session</button><button onclick="resetTo('encounter')">Restart encounter</button></div><p class="notice">Export JSON and attach it to our chat for next-session preparation. No automatic upload. Review HP, resources, loot, clues, NPCs and theories before ending.</p><button class="primary" onclick="finishSession()">End session & export</button></article><article><h2>Audio assignments</h2>${audioNames.map(n=>`<label>${n} · ${esc(S.audioAssignments[n]||'not assigned')}<input type="file" accept="audio/*" onchange="assignAudio('${n}',this.files[0])"></label>`).join('')}<p>Audio files must be selected again after reopening unless browser audio storage is available.</p><a href="https://tabletopaudio.com/">Tabletop Audio</a></article>`}
const ruleData=[['Ability checks','d20 + ability modifier + proficiency if applicable; meet DC. Advantage/disadvantage cancel.'],['Actions','Attack, Dash, Disengage, Dodge, Help, Hide, Influence, Magic, Ready, Search, Study, Utilize. Bonus action only if granted.'],['Opportunity attack','Reaction melee attack just before a visible creature leaves reach using its movement, action, bonus action or reaction. Disengage prevents it.'],['Concentration','CON save when damaged: DC 10 or half damage rounded down, maximum 30. One concentration effect at a time.'],['Heroic Inspiration','Spend immediately after rolling any die to reroll; use new result. Hold one; excess can be given to another PC without it. Humans gain one after long rest.'],['Death saves','At start of turn at 0 HP: 10+ succeeds; three successes stabilize, three failures die. Natural 1 two failures; natural 20 regain 1 HP.'],['Critical hit','Double damage dice, add modifiers once. Natural 1 attack misses.'],['Cover','Half cover +2 AC and DEX saves; three-quarters +5; total cover prevents direct targeting.'],['Prone','Crawl or stand for half Speed. Own attacks disadvantage; attacks against you advantage within 5 feet, otherwise disadvantage.'],['Grappled','Speed 0; disadvantage on attacks against targets other than grappler; can be moved by grappler subject to rules.'],['Dash','Additional movement equal to Speed.'],['Disengage','Movement does not provoke opportunity attacks this turn.'],['Dodge','Visible attackers have disadvantage; advantage on DEX saves until next turn, unless incapacitated or Speed 0.'],['Short rest','At least one hour; may spend Hit Dice to heal. Review class-specific recovery.'],['Long rest','Normally at least eight hours; restore HP and spent Hit Dice; review class-specific resources and conditions.'],['Weapon mastery','Vex: advantage on next attack against target before end of next turn after hit and damage. Nick: extra Light attack as part of Attack action once per turn.'],['Qi Cultivator (homebrew)','Use approved class sheet; exact resource recovery and abilities pending verification.']];
function rulesPlus(){return `<article><h2>Search rules · 2024 summaries</h2><input id="ruleSearch" type="text" placeholder="Search rules" value="${esc(ruleQuery)}" oninput="ruleQuery=this.value;showRules()"><div id="ruleResults"></div><a href="https://www.dndbeyond.com/sources/dnd/free-rules" target="_blank">Official free rules</a><h3>House rules / rulings</h3><textarea onchange="field(S.campaign,'rulings',this.value)">${esc(S.campaign.rulings)}</textarea></article>`}
function showRules(){if($('ruleResults'))$('ruleResults').innerHTML=ruleData.filter(r=>r.join(' ').toLowerCase().includes(ruleQuery.toLowerCase())).map(r=>`<details open><summary>${esc(r[0])}</summary>${esc(r[1])}</details>`).join('')||'No match; consult official rules.'}
function assignAudio(n,f){if(f){if(tracks[n])URL.revokeObjectURL(tracks[n]);tracks[n]=URL.createObjectURL(f);change(()=>S.audioAssignments[n]=f.name)}}
function render(){ $('nav').innerHTML=`<button onclick="undo()" ${history.length?'':'disabled'}>↶ Undo</button><button onclick="redo()" ${redoStack.length?'':'disabled'}>↷ Redo</button>`+['Session','Combat','Encounters','Party','Campaign','Notes','Rules','Setup'].map(t=>`<button class="${t===tab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');if(!['Session','Combat','Encounters','Party','Campaign','Notes','Rules','Setup'].includes(tab))tab='Session';$('main').innerHTML=`<div class="row spread" style="margin-bottom:10px"><small id="saveStatus">${storage?'Saved locally':'SAVE FAILED — export now'}</small><strong style="color:var(--gold)">${practice?'PRACTICE · isolated copy':'LIVE CAMPAIGN'} · Session ${esc(S.session)}</strong></div>`+({Session:sessionView,Combat:combatView,Encounters:libraryView,Party:partyPlus,Campaign:campaignView,Notes:notesView,Rules:rulesPlus,Setup:setupPlus}[tab])();if(tab==='Rules')showRules();audioBar()}

const oldLibrary=libraryView, oldCombat=combatView, oldSetup=setupPlus;
libraryView=function(){return oldLibrary()+`<article><h3>Delete templates</h3>${S.encounters.map((e,i)=>`<p>${esc(e.name)} <button onclick="deleteEncounter(${i})">Delete</button></p>`).join('')}${S.library.map((m,i)=>`<p>${esc(m.name)} <button onclick="deleteTemplate(${i})">Delete</button></p>`).join('')}</article>`};
function deleteEncounter(i){if(confirm('Delete encounter?'))change(()=>S.encounters.splice(i,1))}
function deleteTemplate(i){if(confirm('Delete template?'))change(()=>{let id=S.library[i].id;S.library.splice(i,1);S.encounters.forEach(e=>delete e.members[id])})}
combatView=function(){return oldCombat()+`<article><h3>Add reinforcement</h3>${S.library.map((m,i)=>`<button onclick="reinforce(${i})">${esc(m.name)} · AC ${m.ac} · HP ${m.max}</button> `).join('')}${(S.reminders||[]).filter(r=>r.round===S.round).map(r=>`<details><summary>${esc(r.title)}</summary><p>${esc(r.text)}</p></details>`).join('')}</article>`};
setupPlus=function(){return `<article><h2>Private preparation import</h2><input type="file" accept=".json" onchange="importPack(this.files[0])"></article>`+oldSetup()};
async function importPack(file){try{let p=JSON.parse(await file.text());if(p.kind!=='lost-covenant-prep'||!Array.isArray(p.party)||!p.scenes?.length||!Array.isArray(p.library)||!Array.isArray(p.encounters))throw Error('Invalid pack');if(!confirm('Merge preparation? Existing live HP and notes preserved.'))return;change(()=>{for(let x of p.party){let old=S.party.find(y=>y.id===x.id||y.name===x.name);if(old){old.info=x.info;old.hook=x.hook;let f=fighter(old.id);if(f)f.info=x.info}else S.party.push(x)}for(let k of ['library','encounters','clues']){S[k]??=[];for(let x of p[k]||[]){let i=S[k].findIndex(y=>y.id===x.id);if(i<0)S[k].push(x);else if(k!=='clues')S[k][i]=x}}S.scenes=p.scenes;S.scene=Math.min(S.scene,S.scenes.length-1);S.reminders=p.reminders||[];if(!S.npcs)S.npcs=p.npcs||'';normalize()});if(!S.notes.length&&!S.log.length&&!S.started){checkpoint=clone(S);previous=clone(S);save()}alert('Imported')}catch(e){alert(e.message)}}
save();
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.error);
</script></body></html>
